# Publicação no Netlify: o site é o jogo estático gerado em dist/.
# O salvamento no Obsidian (server.js) só roda no seu computador.
# Login na nuvem: SUPABASE_URL e SUPABASE_ANON_KEY ficam abaixo, em [build.environment] (ver README).

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  # Login na nuvem. A chave publishable é pública por natureza (vai dentro da página);
  # quem protege os dados é a RLS da tabela saves. A chave secreta (sb_secret_) nunca entra aqui.
  SUPABASE_URL = "https://nxtecdtjrxmzdubkmjrh.supabase.co"
  SUPABASE_ANON_KEY = "sb_publishable_y5HPoVlzXphMzoLtbRXC8Q_e50lkEJi"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(self), camera=(), microphone=()"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
