# Publicação no Netlify: o site é o jogo estático gerado em dist/.
# O salvamento no Obsidian (server.js) só roda no seu computador.
# Login na nuvem: defina SUPABASE_URL e SUPABASE_ANON_KEY nas variáveis de ambiente do site (ver README).

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(self), camera=(), microphone=()"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
