# O site agora é publicado no Firebase Hosting (firebase.json). Este arquivo fica
# para o endereço antigo dojo-do-foco.netlify.app continuar levando ao domínio.
# O salvamento no Obsidian (server.js) só roda no seu computador.
# Login na nuvem: a configuração pública fica em supabase/config.json.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Domínio próprio: o endereço antigo do Netlify leva para dojodofoco.com.
[[redirects]]
  from = "https://dojo-do-foco.netlify.app/*"
  to = "https://dojodofoco.com/:splat"
  status = 301
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(self), camera=(), microphone=()"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
